name: Evolution Benchmarks

on:
  workflow_dispatch:
    inputs:
      rebaseline_tank:
        description: "Run the tank champion re-baseline job (survival_5k 3-seed matrix + ecosystem_health_10k) and upload raw results as an artifact"
        type: boolean
        default: false
      float_fingerprint:
        description: "Print a bit-exact fingerprint of float primitives, for diffing against a dev machine"
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * *'
  # Champion reproduction and determinism are properties of a *change*, so they
  # have to be checked before the change lands. Running these only on the cron
  # meant a behavior-changing merge went green and the stale champion surfaced
  # as a mystery nightly failure days later - see PR #940, where the nightly was
  # red for four consecutive nights before anyone traced it back to 3655442a.
  pull_request:

# A PR that gets pushed twice does not need two full benchmark runs; the cron
# and dispatch runs are never superseded, so only PR runs cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-champions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -e .
      - name: Validate Champion Provenance
        run: python3 tools/validate_champion_provenance.py
      - name: Verify Champions
        run: python3 tools/verify_all_champions.py
      - name: Upload verification results
        # The fresh verify_*.json results are the only record of what THIS
        # environment computed - essential when a champion fails to reproduce
        # (e.g. cross-environment float divergence) and the recorded champion
        # needs to be re-baselined to the CI-canonical values.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-verification-results
          path: |
            verify_*.json
            verify_*.jsonl
          if-no-files-found: ignore

  benchmark-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -e .
      - name: Run Tank Benchmark (determinism check)
        timeout-minutes: 10
        run: python tools/run_bench.py benchmarks/tank/survival_5k.py --seed 42 --verify-determinism
      - name: Run Soccer Benchmark (determinism check)
        timeout-minutes: 5
        run: python benchmarks/soccer/training_5k.py --verify-determinism
      - name: Run Poker Ladder Benchmark (determinism check)
        timeout-minutes: 5
        run: |
          mkdir -p research
          python tools/run_bench.py benchmarks/poker/ladder_20k.py --seed 42 --verify-determinism \
            --record-skill --skill-ledger research/skill_history.jsonl
      - name: Record foraging skill history
        run: |
          python tools/run_bench.py benchmarks/tank/foraging_gym.py --seed 42 \
            --record-skill --skill-ledger research/skill_history.jsonl
      - name: Run Soccer Ladder Benchmark (determinism check)
        timeout-minutes: 10
        run: |
          python tools/run_bench.py benchmarks/soccer/ladder_5k.py --seed 42 --verify-determinism \
            --record-skill --skill-ledger research/skill_history.jsonl
      - name: Build longitudinal skill report
        run: python tools/skill_report.py --format html --out skill_report.html
      - name: Upload skill history artifact
        uses: actions/upload-artifact@v4
        with:
          name: frozen-ruler-skill-history
          path: |
            research/skill_history.jsonl
            skill_report.html

  rebaseline-tank-champions:
    # Manual-only: this workflow's own bench-gate history shows tank benchmarks
    # are not bit-identical Windows-vs-Linux, so re-baselining champions/tank/*.json
    # must use CI's own canonical scores rather than a local run. Dispatch with
    # rebaseline_tank=true, then pull the "tank-champion-rebaseline" artifact.
    if: github.event_name == 'workflow_dispatch' && inputs.rebaseline_tank
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -e .
      - name: Run survival_5k seed matrix
        run: |
          python tools/run_bench_matrix.py benchmarks/tank/survival_5k.py \
            --seeds 42,7,123 --out survival_5k_matrix.json
      - name: Run ecosystem_health_10k
        run: |
          python tools/run_bench.py benchmarks/tank/ecosystem_health_10k.py \
            --seed 42 --out ecosystem_health_10k_result.json
      - name: Upload rebaseline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tank-champion-rebaseline
          path: |
            survival_5k_matrix.json
            ecosystem_health_10k_result.json
          if-no-files-found: warn

  float-fingerprint:
    # Manual-only diagnostic for the cross-machine benchmark divergence: prints
    # a bit-exact hash per float primitive so CI's Linux/CPython 3.10 can be
    # diffed against a dev machine. See tools/float_fingerprint.py.
    if: github.event_name == 'workflow_dispatch' && inputs.float_fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Fingerprint float primitives
        run: python3 tools/float_fingerprint.py
